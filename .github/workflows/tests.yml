# The offline suite, on every pull request and push to master: no keys or network calls needed.
name: tests

on:
  pull_request:
  push:
    branches: [master]

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Python and uv, pinned in .python-version and mise.toml.
      - uses: jdx/mise-action@v5
      - run: uv run --with-requirements requirements.txt python -m unittest
