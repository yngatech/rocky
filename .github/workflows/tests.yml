# The offline suite, on every pull request and push to master: no keys or network calls needed.
name: tests

on:
  pull_request:
  push:
    branches: [master]

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv run --python 3.14 --with-requirements requirements.txt python -m unittest
