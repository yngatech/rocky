# Development tools for this repository. `scripts/setup.sh` installs them; CI
# installs them with jdx/mise-action. Python is pinned by `.python-version`,
# which uv also reads, so `uv run` picks the same Python with or without mise.
min_version = "2026.10.17"

[settings]
idiomatic_version_file_enable_tools = ["python"]

[tools]
uv = "0.13.8"
